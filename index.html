<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#222222">
    <link rel="manifest" href="manifest.json">
    <title>GRNDbrekers Rodeo Bull - StuDAY 2025</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* FIXED: Force body background to be visible */
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%) !important;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            color: white;
        }

        .screen {
            display: none;
            flex: 1;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
        }

        .screen.active {
            display: flex;
        }

        .screen-content {
            max-width: 400px;
            width: 100%;
            display: block !important;
            visibility: visible !important;
        }

        .logo-container {
            margin-bottom: 30px;
        }

        .logo {
            width: 300px;
            height: 180px;
            margin: 0 auto 20px;
            background: rgba(255,255,255,0.1);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
            overflow: hidden;
        }

        .logo img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 15px;
        }

        .btn {
            background: linear-gradient(45deg, #4CAF50, #45a049);
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 25px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin: 10px;
            min-height: 50px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            display: inline-block !important;
            visibility: visible !important;
            width: auto;
        }

        /* Specific button styles */
        .btn-blue {
            background: linear-gradient(45deg, #2196F3, #1976D2);
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 20px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            display: inline-block !important;
            visibility: visible !important;
        }

        .btn-green {
            background: linear-gradient(45deg, #4CAF50, #45a049);
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 20px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            display: inline-block !important;
            visibility: visible !important;
        }

        .btn-red {
            background: linear-gradient(45deg, #f44336, #d32f2f);
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 20px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            display: inline-block !important;
            visibility: visible !important;
        }

        .top-button {
            background: linear-gradient(45deg, #FFD700, #FFA000);
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 20px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            display: block !important;
            visibility: visible !important;
            margin: 0 auto 20px;
        }

        /* Button hover effects */
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }

        .btn-blue:hover, .btn-green:hover, .btn-red:hover, .top-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }

        .btn:active {
            transform: translateY(0);
        }

        /* FIXED: Force input fields to be visible */
        .input-field, select.input-field {
            width: 100% !important;
            padding: 15px !important;
            margin: 10px 0 !important;
            border: 2px solid rgba(255,255,255,0.3) !important;
            border-radius: 15px !important;
            background: rgba(255,255,255,0.1) !important;
            color: white !important;
            font-size: 16px !important;
            backdrop-filter: blur(10px) !important;
            display: block !important;
            visibility: visible !important;
        }

        .input-field::placeholder {
            color: rgba(255,255,255,0.7);
        }

        select.input-field {
            color: white;
            background: rgba(255,255,255,0.1);
        }

        select.input-field option {
            background: #333;
            color: white;
        }

        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255,255,255,0.2);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 10px;
            cursor: pointer;
        }

        .rider-tag {
            display: flex;
            align-items: center;
            background: rgba(76,175,80,0.3);
            color: white;
            padding: 10px 15px;
            margin: 8px;
            border-radius: 20px;
            border: 1px solid #4CAF50;
            font-size: 14px;
            position: relative;
        }

        .edit-btn-left {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            padding: 5px 8px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 12px;
            margin-right: 10px;
            flex-shrink: 0;
        }

        .edit-btn-left:hover {
            background: rgba(255,255,255,0.3);
        }

        .rider-photo-small {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            margin-right: 10px;
            background: rgba(255,255,255,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 2px solid rgba(255,255,255,0.3);
            flex-shrink: 0;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .rider-photo-small:hover {
            transform: scale(1.1);
        }

        .rider-photo-small img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .rider-info {
            flex: 1;
            text-align: left;
        }

        .rider-actions {
            display: flex;
            gap: 5px;
            margin-left: 10px;
        }

        .action-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            padding: 5px 8px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 12px;
        }

        .action-btn:hover {
            background: rgba(255,255,255,0.3);
        }

        .remove-btn {
            background: rgba(255,107,53,0.8);
        }

        /* Time input layout */
        .time-inputs-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            margin: 20px 0;
            max-width: 100%;
        }

        .time-input {
            width: 70px;
            padding: 12px 8px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 10px;
            background: rgba(255,255,255,0.1);
            color: white;
            font-size: 16px;
            text-align: center;
            backdrop-filter: blur(10px);
        }

        .time-input::placeholder {
            color: rgba(255,255,255,0.7);
        }

        .time-separator {
            color: white;
            font-size: 20px;
            font-weight: bold;
            margin: 0 2px;
        }

        /* Side buttons layout for name entry screen */
        .side-buttons-name {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 20px 0;
            width: 100%;
        }

        /* Side buttons layout for time entry screen */
        .side-buttons-time {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 20px 0;
            width: 100%;
        }

        /* Leaderboard navigation buttons */
        .leaderboard-nav-buttons {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            width: 100%;
        }

        .leaderboard-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .leaderboard-logo {
            width: 100%;
            max-width: none;
            max-height: 300px;
            object-fit: contain;
            margin: 0 auto 25px;
            display: block;
            border-radius: 15px;
        }

        .remaining-riders {
            margin-top: 30px;
        }

        .remaining-riders h3 {
            text-align: center;
            margin-bottom: 15px;
            opacity: 0.8;
            font-size: 16px;
        }

        .remaining-leaderboard {
            max-height: 300px;
            overflow-y: auto;
            background: rgba(255,255,255,0.05);
            border-radius: 15px;
            padding: 10px;
        }

        .remaining-entry {
            background: rgba(255,255,255,0.1);
            margin: 8px 0;
            padding: 12px;
            border-radius: 10px;
            display: grid;
            grid-template-columns: 60px 50px 1fr 80px;
            gap: 10px;
            align-items: center;
            backdrop-filter: blur(10px);
        }

        .remaining-position {
            font-weight: bold;
            text-align: center;
            font-size: 16px;
        }

        .remaining-photo {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 2px solid rgba(255,255,255,0.3);
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .remaining-photo:hover {
            transform: scale(1.1);
        }

        .remaining-photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .remaining-name {
            font-weight: bold;
            font-size: 14px;
        }

        .remaining-time {
            text-align: center;
            font-weight: bold;
            font-size: 14px;
        }

        h1, h2 {
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .added-names {
            max-height: 200px;
            overflow-y: auto;
            margin: 20px 0;
        }

        .debug {
            display: none; /* Hidden in production */
        }

        /* FIXED: Force photo input section to be visible */
        .photo-input-section {
            margin: 15px 0 !important;
            padding: 15px !important;
            background: rgba(255,255,255,0.05) !important;
            border-radius: 15px !important;
            border: 2px dashed rgba(255,255,255,0.3) !important;
            display: block !important;
            visibility: visible !important;
        }

        /* FIXED: Force photo preview to be visible */
        .photo-preview {
            width: 120px !important;
            height: 120px !important;
            border-radius: 50% !important;
            margin: 0 auto 15px !important;
            background: rgba(255,255,255,0.1) !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            overflow: hidden !important;
            border: 3px solid rgba(255,255,255,0.3) !important;
            visibility: visible !important;
        }

        .photo-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .photo-btn {
            background: linear-gradient(45deg, #2196F3, #1976D2);
            padding: 10px 20px;
            font-size: 14px;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 10000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.8);
            backdrop-filter: blur(5px);
        }

        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 20px;
            padding: 30px;
            border-radius: 20px;
            max-width: 500px;
            width: 90%;
            text-align: center;
            color: white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            position: relative;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-close {
            position: absolute;
            top: 15px;
            right: 20px;
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
            border-radius: 50%;
            width: 40px;
            height: 40px;
        }

        .photo-gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }

        .photo-option {
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            padding: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }

        .photo-option:hover {
            background: rgba(255,255,255,0.2);
            border-color: #4CAF50;
        }

        .photo-option.selected {
            border-color: #FFD700;
            background: rgba(255,215,0,0.2);
        }

        .photo-option img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 8px;
        }

        .photo-option-text {
            font-size: 12px;
            opacity: 0.8;
        }

        /* Photo Modal */
        .photo-modal {
            display: none;
            position: fixed;
            z-index: 20000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.95);
            backdrop-filter: blur(5px);
        }

        .photo-modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .photo-modal-content {
            max-width: calc(100vw - 40px);
            max-height: calc(100vh - 40px);
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            cursor: pointer;
        }

        .clickable-photo {
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .clickable-photo:hover {
            transform: scale(1.1);
        }

        @media (max-width: 480px) {
            .leaderboard-logo {
                max-width: 100%;
                max-height: 300px;
            }
            
            .time-input {
                width: 55px;
                padding: 10px 6px;
                font-size: 14px;
            }
            
            .time-separator {
                font-size: 18px;
                margin: 0 1px;
            }
            
            .screen-content {
                padding: 10px;
            }
            
            .top-button, .btn-red {
                padding: 10px 20px;
                font-size: 14px;
                margin-bottom: 15px;
            }
            
            .btn-blue, .btn-green {
                padding: 10px 15px;
                font-size: 14px;
            }
            
            .side-buttons-name, .side-buttons-time {
                margin: 15px 0;
            }

            .leaderboard-nav-buttons {
                margin-bottom: 10px;
            }
            
            .remaining-entry {
                grid-template-columns: 50px 40px 1fr 70px;
                gap: 8px;
                padding: 10px;
            }

            .rider-tag {
                padding: 8px 12px;
            }

            .rider-photo-small {
                width: 35px;
                height: 35px;
            }

            .rider-actions {
                gap: 3px;
            }

            .action-btn, .edit-btn-left {
                padding: 4px 6px;
                font-size: 11px;
            }

            .photo-gallery {
                grid-template-columns: repeat(3, 1fr);
            }

            .photo-preview {
                width: 80px;
                height: 80px;
            }

            .photo-input-section {
                padding: 10px;
            }
        }
    </style>
</head>
    
<body>
    <div class="debug" id="debug">Loading...</div>

    <!-- Home Screen -->
    <div class="screen active" id="homeScreen">
        <div class="screen-content">
            <div class="logo-container">
                <div class="logo">
                    <img src="https://raw.githubusercontent.com/SergeHanssens/grndbrekers-bull-studay2025/images/grndbrekers-bull-logo-transparant-V5.png" 
                         alt="GRNDbrekers Logo"
                         onerror="this.outerHTML='<div style=color:white;font-size:18px;>🛠️ GRNDbrekers 🐂<br><small>Bull Riding Leaderboard</small></div>';">
                </div>
            </div>
            <!-- FIXED: Only clears LOCAL data, NOT server data -->
            <button class="btn" onclick="startLeaderboardWithClear()">Start Leaderboard!</button>
        </div>
    </div>

    <!-- Name Entry Screen -->
    <div class="screen" id="nameEntryScreen">
        <div class="screen-content">
            <button class="top-button" onclick="showScreen('leaderboardScreen')">🏆 Ranking</button>
            
            <h2>Voeg Rijders Toe</h2>
            
            <!-- Photo Section -->
            <div class="photo-input-section">
                <div class="photo-preview" id="photoPreview">
                    📷
                </div>
                <input type="file" id="photoInput" accept="image/*" capture="environment" style="display: none;">
                <button class="btn photo-btn" onclick="document.getElementById('photoInput').click()">Foto Maken (Optioneel)</button>
            </div>
            
            <input type="text" class="input-field" id="riderName" placeholder="Naam van rijder" style="margin-top: 0;">
            
            <div class="side-buttons-name">
                <button class="btn-blue" onclick="addRider()">Opslaan</button>
                <button class="btn-green" onclick="showScreen('timeEntryScreen')" id="nextToTimeBtn" style="display: none;">Tijden</button>
            </div>
            
            <div class="added-names" id="addedNames"></div>
        </div>
    </div>

    <!-- Time Entry Screen -->
    <div class="screen" id="timeEntryScreen">
        <div class="screen-content">
            <button class="top-button" onclick="showScreen('leaderboardScreen')">🏆 Ranking</button>
            
            <h2>Voeg Tijd Toe</h2>
            
            <div class="side-buttons-time">
                <button class="btn-green" onclick="showScreen('nameEntryScreen')">Rijders</button>
            </div>
            
            <!-- Riders Without Time List -->
            <div class="added-names" id="ridersForTimeEntry" style="max-height: calc(100vh - 200px); flex: 1;">
                <p style="text-align: center; opacity: 0.7;">Selecteer een rijder om een tijd toe te voegen...</p>
            </div>
        </div>
    </div>

    <!-- Leaderboard Screen -->
    <div class="screen" id="leaderboardScreen">
        <div class="screen-content">
            <!-- FIXED: Now uses resetServerData for server data reset -->
            <button class="btn-red" onclick="resetAllServerData()">🗑️ Reset</button>
            
            <!-- Logo Header -->
            <div class="leaderboard-header">
                <img src="https://raw.githubusercontent.com/SergeHanssens/grndbrekers-bull-studay2025/images/grndbrekers-bull-logo-transparant-V5.png" 
                     alt="GRNDbrekers Logo" class="leaderboard-logo"
                     onerror="this.outerHTML='<h2 style=color:white;>🛠️ GRNDbrekers Bull Riding</h2>';">
            </div>
            
            <!-- Navigation buttons above list -->
            <div class="leaderboard-nav-buttons">
                <button class="btn-green" onclick="showScreen('timeEntryScreen')">Tijd</button>
                <button class="btn-green" onclick="showScreen('nameEntryScreen')">Rijders</button>
            </div>
            
            <!-- Leaderboard List -->
            <div class="remaining-riders" id="leaderboardSection">
                <div id="leaderboardList"></div>
            </div>
        </div>
    </div>

    <!-- Edit Modal -->
    <div class="modal" id="editModal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeEditModal()">×</button>
            <h3>Rijder Bewerken</h3>
            
            <div class="photo-input-section">
                <div class="photo-preview" id="editPhotoPreview">
                    📷
                </div>
                <input type="file" id="editPhotoInput" accept="image/*" capture="environment" style="display: none;">
                <button class="btn photo-btn" onclick="document.getElementById('editPhotoInput').click()">Foto Wijzigen</button>
            </div>
            
            <input type="text" class="input-field" id="editRiderName" placeholder="Naam van rijder">
            
            <div style="margin-top: 20px;">
                <button class="btn" onclick="saveEditedRider()">Wijzigingen Opslaan</button>
                <button class="btn" onclick="closeEditModal()" style="background: rgba(255,255,255,0.2);">Annuleren</button>
            </div>
        </div>
    </div>

    <!-- Time Edit Modal -->
    <div class="modal" id="timeEditModal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeTimeEditModal()">×</button>
            <h3>Tijd Toevoegen</h3>
            
            <div class="photo-input-section">
                <div class="photo-preview" id="timeEditPhotoPreview">
                    📷
                </div>
                <input type="file" id="timeEditPhotoInput" accept="image/*" capture="environment" style="display: none;">
                <button class="btn photo-btn" onclick="document.getElementById('timeEditPhotoInput').click()">Foto Wijzigen</button>
            </div>
            
            <div class="time-inputs-container">
                <input type="number" class="time-input" id="editMinutes" placeholder="Min" min="0" max="999">
                <span class="time-separator">:</span>
                <input type="number" class="time-input" id="editSeconds" placeholder="Sec" min="0" max="59">
                <span class="time-separator">:</span>
                <input type="number" class="time-input" id="editHundredths" placeholder="1/100" min="0" max="99">
            </div>
            
            <div style="margin-top: 20px;">
                <button class="btn" onclick="saveRiderTime()">Wijzigingen Opslaan</button>
                <button class="btn" onclick="closeTimeEditModal()" style="background: rgba(255,255,255,0.2);">Annuleren</button>
            </div>
        </div>
    </div>

    <!-- Duplicate Name Modal -->
    <div class="modal" id="duplicateModal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeDuplicateModal()">×</button>
            <h3>Naam bestaat al</h3>
            <p id="duplicateMessage">Deze naam is al gebruikt. Kies een foto:</p>
            
            <div class="photo-gallery" id="photoGallery"></div>
            
            <div style="margin-top: 20px;">
                <button class="btn" onclick="useSelectedPhoto()">Gebruik Geselecteerde Foto</button>
                <button class="btn photo-btn" onclick="takeNewPhoto()">Nieuwe Foto Maken</button>
                <button class="btn" onclick="addWithoutPhoto()" style="background: linear-gradient(45deg, #9C27B0, #673AB7);">Voeg Toe Zonder Foto</button>
            </div>
        </div>
    </div>

    <!-- Photo Modal -->
    <div class="photo-modal" id="photoModal" onclick="closePhotoModal()">
        <img class="photo-modal-content" id="photoModalContent" alt="Full size photo">
    </div>

    <!-- Socket.IO and Sync Client -->
    <script src="/socket.io/socket.io.js"></script>
    <script src="sync-client.js"></script>

    <script>
        // Debug function
        function updateDebug(message) {
            // Debug disabled in production
            console.log('DEBUG:', message);
        }

        updateDebug('Script starting...');

        // Global variables
        window.riders = [];

            if (window.timeEditingRiderIndex === null || window.timeEditingRiderIndex === undefined) {
                alert('Fout: Geen rijder geselecteerd voor tijdinvoer!');

            // Get values (default to 0 if empty)

            const seconds = document.getElementById('editSeconds').value || '0';
            const hundredths = document.getElementById('editHundredths').value || '0';
            
            // Validate inputs
            const minInt = parseInt(minutes);
            const secInt = parseInt(seconds);
            const hunInt = parseInt(hundredths);
            
            if (isNaN(minInt) || isNaN(secInt) || isNaN(hunInt)) {
                alert('Alle tijdvelden moeten geldige getallen zijn!');
                return;
            }
            
            if (minInt < 0 || secInt < 0 || secInt > 59 || hunInt < 0 || hunInt > 99) {
                alert('Ongeldige tijd ingevoerd! Controleer de waarden.');
                return;
            }

            const timeString = `${minInt.toString().padStart(2, '0')}:${secInt.toString().padStart(2, '0')}:${hunInt.toString().padStart(2, '0')}`;
            const timeValue = minInt * 6000 + secInt * 100 + hunInt;

            // Update photo if changed
            const timeEditPreview = document.getElementById('timeEditPhotoPreview');
            if (timeEditPreview && timeEditPreview.dataset.newPhoto) {
                rider.photo = JSON.parse(timeEditPreview.dataset.newPhoto);
            }

            // Update rider
            rider.time = timeString;
            rider.timeValue = timeValue;

            // Add to leaderboard
            const entry = {
                id: rider.id,
                name: rider.name,
                photo: rider.photo,
                time: timeString,
                timeValue: timeValue,
                timestamp: new Date().toISOString()
            };

            // Remove existing entry if any
            window.leaderboardData = window.leaderboardData.filter(e => e.id !== entry.id);
            window.leaderboardData.push(entry);
            
            // Sort by time (LONGEST first - who stayed on longest)

                        });

        // Photo compression function - creates both thumbnail and fullsize
        function compressImage(file, thumbWidth = 100, thumbHeight = 100, fullWidth = 800, fullHeight = 600) {
            return new Promise((resolve) => {
                const img = new Image();
                
                img.onload = function() {
                    // Create thumbnail (for lists)
                    const thumbCanvas = document.createElement('canvas');
                    const thumbCtx = thumbCanvas.getContext('2d');
                    
                    let thumbW = img.width;
                    let thumbH = img.height;
                    
                    if (thumbW > thumbH) {
                        if (thumbW > thumbWidth) {
                            thumbH = (thumbH * thumbWidth) / thumbW;
                            thumbW = thumbWidth;
                        }
                    } else {
                        if (thumbH > thumbHeight) {
                            thumbW = (thumbW * thumbHeight) / thumbH;
                            thumbH = thumbHeight;
                        }
                    }
                    
                    thumbCanvas.width = thumbW;
                    thumbCanvas.height = thumbH;
                    thumbCtx.drawImage(img, 0, 0, thumbW, thumbH);
                    
                    // Create fullsize (for zoom)
                    const fullCanvas = document.createElement('canvas');
                    const fullCtx = fullCanvas.getContext('2d');
                    
                    let fullW = img.width;
                    let fullH = img.height;
                    
                    if (fullW > fullH) {
                        if (fullW > fullWidth) {
                            fullH = (fullH * fullWidth) / fullW;
                            fullW = fullWidth;
                        }
                    } else {
                        if (fullH > fullHeight) {
                            fullW = (fullW * fullHeight) / fullH;
                            fullH = fullHeight;
                        }
                    }
                    
                    fullCanvas.width = fullW;
                    fullCanvas.height = fullH;
                    fullCtx.drawImage(img, 0, 0, fullW, fullH);
                    
                    // Return both versions
                    resolve({
                        thumbnail: thumbCanvas.toDataURL('image/jpeg', 0.7),
                        fullsize: fullCanvas.toDataURL('image/jpeg', 0.85)
                    });
                };
                
                img.src = URL.createObjectURL(file);
            });
        }

        // Validate time input fields
        function validateTimeInput(inputId, maxValue, fieldName) {
            const input = document.getElementById(inputId);
            if (!input) return false;
            
            const value = input.value;
            
            // Check if empty (allow empty for optional fields)
            if (value === '' || value === null) {
                return true; // Empty is okay, will default to 0
            }
            
            // Check if it's a valid number
            const numValue = parseFloat(value);
            
            // Must be a natural number (positive integer, no decimals)
            if (!Number.isInteger(numValue) || numValue < 0) {
                alert(`${fieldName} moet een natuurlijk getal zijn (0, 1, 2, 3, ...)!`);
                input.focus();
                return false;
            }
            
            // Check maximum value
            if (numValue > maxValue) {
                alert(`${fieldName} mag maximaal ${maxValue} zijn!`);
                input.focus();
                return false;
            }
            
            return true;
        }

                const entryDiv = document.createElement('div');
                entryDiv.className = 'remaining-entry';
                
                // Add special styling for top 3
                let medalEmoji = '';
                if (position === 1) medalEmoji = '🥇 ';
                else if (position === 2) medalEmoji = '🥈 ';
                else if (position === 3) medalEmoji = '🥉 ';
                
                // Handle both old string format and new object format
                const thumbnailSrc = entry.photo && typeof entry.photo === 'object' ? entry.photo.thumbnail : entry.photo;
                const hasPhoto = entry.photo && (typeof entry.photo === 'object' ? entry.photo.thumbnail : entry.photo);
                
                entryDiv.innerHTML = `
                    <div class="remaining-position">${medalEmoji}#${position}</div>
                    <div class="remaining-photo" onclick="openPhotoModal(${JSON.stringify(entry.photo).replace(/"/g, '&quot;')}, '${entry.name}')">
                        ${hasPhoto ? `<img src="${thumbnailSrc}" alt="${entry.name}" class="clickable-photo">` : '👤'}
                    </div>
                    <div class="remaining-name">${entry.name}</div>
                    <div class="remaining-time">${entry.time}</div>
                `;
                
                leaderboardContainer.appendChild(entryDiv);
            });
            
            container.innerHTML = '';
            container.appendChild(leaderboardContainer);
        }

        // Real-time input validation as user types
        function addRealTimeValidation() {
            // Edit time inputs (new modal fields)
            const editMinutes = document.getElementById('editMinutes');
            const editSeconds = document.getElementById('editSeconds');
            const editHundredths = document.getElementById('editHundredths');
            
            if (editMinutes) {
                editMinutes.addEventListener('input', function(e) {
                    let value = e.target.value;
                    value = value.replace(/[^0-9]/g, '');
                    e.target.value = value;
                });
            }
            
            if (editSeconds) {
                editSeconds.addEventListener('input', function(e) {
                    let value = e.target.value;
                    value = value.replace(/[^0-9]/g, '');
                    if (parseInt(value) > 59) {
                        value = '59';
                    }
                    e.target.value = value;
                });
            }
            
            if (editHundredths) {
                editHundredths.addEventListener('input', function(e) {
                    let value = e.target.value;
                    value = value.replace(/[^0-9]/g, '');
                    if (parseInt(value) > 99) {
                        value = '99';
                    }
                    e.target.value = value;
                });
            }
        }

        // Add Enter key support for better UX
        function addEnterKeySupport() {
            // Enter key on rider name adds rider
            const riderNameField = document.getElementById('riderName');
            if (riderNameField) {
                riderNameField.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') {
                        addRider();
                    }
                });
            }
            
            // Enter key on time fields in edit modal
            ['editMinutes', 'editSeconds', 'editHundredths'].forEach(fieldId => {
                const field = document.getElementById(fieldId);
                if (field) {
                    field.addEventListener('keypress', function(e) {
                        if (e.key === 'Enter') {
                            saveRiderTime();
                        }
                    });
                }
            });
        }

        // Save data to localStorage
        function saveData() {
            try {
                localStorage.setItem('rodeoRiders', JSON.stringify(window.riders));
                localStorage.setItem('rodeoLeaderboard', JSON.stringify(window.leaderboardData));
                updateDebug('Data saved');
            } catch (e) {
                updateDebug('Save failed: ' + e.message);
            }
        }

        // Load data from localStorage
        function loadData() {
            try {
                const savedRiders = localStorage.getItem('rodeoRiders');
                const savedLeaderboard = localStorage.getItem('rodeoLeaderboard');
                
                if (savedRiders) {
                    window.riders = JSON.parse(savedRiders);
                    updateDebug('Loaded ' + window.riders.length + ' riders');
                }
                
                if (savedLeaderboard) {
                    window.leaderboardData = JSON.parse(savedLeaderboard);
                    updateDebug('Loaded ' + window.leaderboardData.length + ' leaderboard entries');
                }
            } catch (e) {
                updateDebug('Load failed: ' + e.message);
                window.riders = [];
                window.leaderboardData = [];
            }
        }

        // Legacy resetAll function for compatibility - now redirects to resetAllServerData
        window.resetAll = function() {
            resetAllServerData();
        }

        // Initialize app with all enhancements
        function initApp() {
            updateDebug('Initializing app...');
            
            loadData();
            updateRidersList();
            updateRidersForTimeEntry();
            updateLeaderboard();
            
            // Add the new validation features
            addRealTimeValidation();
            addEnterKeySupport();
            
            // Update button visibility
            updateNextButtonVisibility();
            
            updateDebug('App ready! Functions loaded.');
        }

        // Start app when page loads
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initApp);
        } else {
            initApp();
        }

        updateDebug('Script loaded');
    </script>
</body>
</html>
