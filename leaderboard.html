<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GRNDbrekers Leaderboard</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    header {
      margin-top: 20px;
      text-align: center;
    }

    header img {
      max-height: 180px;
    }

    h1 {
      font-size: 3rem;
      margin: 20px 0;
    }

    .leaderboard {
      flex: 1;
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .leaderboard-entry {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      padding: 15px 25px;
      margin: 5px 0;
      border-radius: 12px;
      font-size: 1.5rem;
      font-weight: bold;
      background: rgba(0,0,0,0.3);
      transition: transform 0.5s, background 0.5s;
    }

    .leaderboard-entry span {
      flex: 1;
      text-align: center;
    }

    .gold {
      background: linear-gradient(45deg, #FFD700, #FFA500);
      color: #222;
      font-size: 2rem;
    }

    .silver {
      background: linear-gradient(45deg, #C0C0C0, #A9A9A9);
      color: #222;
      font-size: 1.8rem;
    }

    .bronze {
      background: linear-gradient(45deg, #CD7F32, #8B4513);
      color: #fff;
      font-size: 1.7rem;
    }

    /* Animaties */
    .fade-in {
      animation: fadeIn 0.6s ease forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .highlight {
      animation: highlightFlash 1s ease;
    }

    @keyframes highlightFlash {
      0% { background: yellow; }
      100% { background: inherit; }
    }

    canvas#confetti {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 999;
    }

  </style>
</head>
<body>
  <canvas id="confetti"></canvas>
  <header>
    <img src="https://raw.githubusercontent.com/SergeHanssens/grndbrekers-bull-studay2025/images/android-chrome-512x512.png" alt="GRNDbrekers Logo">
    <h1>🏆 Top 10 Riders</h1>
  </header>
  <div class="leaderboard" id="leaderboard"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="sync-client.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <script>
    let previousTop10 = [];

    function renderLeaderboard(riders) {
      const container = document.getElementById("leaderboard");
      container.innerHTML = "";

      const top10 = riders.slice(0, 10);

      top10.forEach((rider, index) => {
        const div = document.createElement("div");
        div.classList.add("leaderboard-entry", "fade-in");

        if (index === 0) div.classList.add("gold");
        if (index === 1) div.classList.add("silver");
        if (index === 2) div.classList.add("bronze");

        div.innerHTML = `
          <span>#${index+1}</span>
          <span>${rider.name}</span>
          <span>${rider.time || "--:--:--"}</span>
        `;

        // Check veranderingen
        const oldRider = previousTop10[index];
        if (!oldRider || oldRider.name !== rider.name) {
          div.classList.add("highlight");
          if (index === 0) {
            triggerConfetti();
          }
        }

        container.appendChild(div);
      });

      previousTop10 = top10;
    }

    // Confetti effect voor nieuwe #1
    function triggerConfetti() {
      const duration = 2 * 1000;
      const end = Date.now() + duration;

      (function frame() {
        confetti({
          particleCount: 4,
          angle: 60,
          spread: 55,
          origin: { x: 0 }
        });
        confetti({
          particleCount: 4,
          angle: 120,
          spread: 55,
          origin: { x: 1 }
        });

        if (Date.now() < end) {
          requestAnimationFrame(frame);
        }
      }());
    }

    // Hook met sync-client.js
    window.updateLeaderboard = function(data) {
      renderLeaderboard(data);
    }
  </script>

<script>
  // Probeer automatisch fullscreen te activeren bij laden
  document.addEventListener("DOMContentLoaded", () => {
    const requestFS = () => {
      const el = document.documentElement;
      if (el.requestFullscreen) el.requestFullscreen();
      else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
      else if (el.mozRequestFullScreen) el.mozRequestFullScreen();
      else if (el.msRequestFullscreen) el.msRequestFullscreen();
    };

    // Start fullscreen na korte delay zodat browser het toelaat
    setTimeout(() => {
      requestFS();
    }, 500);

    // Voeg keyboard escape optie toe
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") {
        if (document.exitFullscreen) document.exitFullscreen();
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
        else if (document.mozCancelFullScreen) document.mozCancelFullScreen();
        else if (document.msExitFullscreen) document.msExitFullscreen();
      }
    });
  });
</script>
</body>
</html>
