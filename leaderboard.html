<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GRNDbrekers Leaderboard</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Arial', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      height: 100vh;
      overflow: hidden;
      display: flex;
      position: relative;
    }

    /* Center logo */
    .center-logo {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 35%;
      max-width: 500px;
      min-width: 300px;
      opacity: 1;
      pointer-events: none;
      z-index: 100;
    }

    .center-logo img {
      width: 100%;
      height: auto;
      filter: drop-shadow(0 0 20px rgba(0, 0, 0, 0.5));
    }

    /* Left side - Top 3 */
    .left-section {
      width: 35%;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 2;
    }

    .top-three {
      display: flex;
      flex-direction: column;
      gap: 20px;
      width: 100%;
      max-width: 450px;
    }

    .podium-spot {
      transition: all 0.5s ease;
      position: relative;
    }

    .podium-card {
      display: flex;
      align-items: center;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      padding: 20px;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
      border: 1px solid rgba(255, 255, 255, 0.18);
      transition: all 0.3s ease;
      gap: 15px;
    }

    .podium-card:hover {
      transform: translateX(10px);
      box-shadow: 0 15px 35px 0 rgba(31, 38, 135, 0.5);
    }

    .podium-spot.gold .podium-card {
      background: linear-gradient(135deg, #FFD700, #FFA500);
      border: 3px solid #FFD700;
      color: #333;
      transform: scale(1.05);
    }

    .podium-spot.silver .podium-card {
      background: linear-gradient(135deg, #C0C0C0, #808080);
      border: 3px solid #C0C0C0;
      color: #333;
    }

    .podium-spot.bronze .podium-card {
      background: linear-gradient(135deg, #CD7F32, #8B4513);
      border: 3px solid #CD7F32;
      color: white;
    }

    .podium-rank {
      font-size: 3rem;
      font-weight: bold;
      min-width: 70px;
      text-align: center;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
    }

    .podium-photo {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid white;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
      background-color: #666;
      flex-shrink: 0;
    }

    .podium-info {
      flex: 1;
    }

    .podium-name {
      font-size: 1.6rem;
      font-weight: bold;
      margin-bottom: 5px;
      word-wrap: break-word;
      word-break: break-word;
      hyphens: auto;
      line-height: 1.3;
    }

    .podium-time {
      font-size: 1.3rem;
      opacity: 0.9;
    }

    /* Right side - Rest (4-10) */
    .right-section {
      width: 35%;
      height: 100vh;
      margin-left: auto;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 20px;
      z-index: 2;
    }

    .rest-leaderboard {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 25px;
      padding: 20px;
      backdrop-filter: blur(10px);
      max-height: 90vh;
      overflow-y: auto;
      overflow-x: hidden;
    }

    .leaderboard-entry {
      display: flex;
      align-items: center;
      padding: 12px 15px;
      margin: 8px 0;
      background: rgba(0, 0, 0, 0.25);
      border-radius: 12px;
      transition: all 0.3s ease;
      gap: 15px;
    }

    .leaderboard-entry:hover {
      background: rgba(0, 0, 0, 0.35);
      transform: translateX(5px);
    }

    .entry-rank {
      font-size: 1.4rem;
      font-weight: bold;
      min-width: 45px;
      text-align: center;
    }

    .entry-photo {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid rgba(255, 255, 255, 0.5);
      background-color: #666;
      flex-shrink: 0;
    }

    .entry-name {
      flex: 1;
      font-size: 1.1rem;
      font-weight: 600;
    }

    .entry-time {
      font-size: 1rem;
      font-weight: 500;
    }

    /* Footer - only for Shiftedmake logo */
    .footer-logo {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
    }

    .footer-logo img {
      height: 35px;
      opacity: 0.6;
      transition: opacity 0.3s ease;
    }

    .footer-logo img:hover {
      opacity: 1;
    }

    /* Animaties */
    .fade-in {
      animation: fadeIn 0.6s ease forwards;
    }

    @keyframes fadeIn {
      from { 
        opacity: 0; 
        transform: translateY(20px); 
      }
      to { 
        opacity: 1; 
        transform: translateY(0); 
      }
    }

    .new-entry-highlight {
      animation: blinkHighlight 6s ease;
    }

    .new-podium-highlight .podium-card {
      animation: blinkHighlight 6s ease;
    }

    @keyframes blinkHighlight {
      0%, 16.66%, 33.33%, 50%, 66.66%, 83.33% { 
        background: rgba(255, 255, 0, 0.6);
        box-shadow: 0 0 30px rgba(255, 255, 0, 0.8);
        transform: scale(1.05);
      }
      8.33%, 25%, 41.66%, 58.33%, 75%, 91.66%, 100% { 
        background: rgba(0, 0, 0, 0.25);
        box-shadow: none;
        transform: scale(1);
      }
    }

    /* Confetti Canvas */
    canvas#confetti {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 999;
    }

    /* No data message */
    .no-data {
      text-align: center;
      padding: 50px 20px;
      font-size: 1.3rem;
      opacity: 0.7;
    }

    /* Scrollbar styling */
    .rest-leaderboard::-webkit-scrollbar {
      width: 8px;
    }

    .rest-leaderboard::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.1);
      border-radius: 10px;
    }

    .rest-leaderboard::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.3);
      border-radius: 10px;
    }

    .rest-leaderboard::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.5);
    }

    /* Responsive adjustments */
    @media (max-width: 1200px) {
      .left-section, .right-section {
        width: 40%;
      }
      
      .center-logo {
        width: 25%;
        min-width: 200px;
      }
    }

    @media (max-width: 768px) {
      .left-section, .right-section {
        width: 45%;
      }
      
      .podium-rank {
        font-size: 2.5rem;
        min-width: 60px;
      }
      
      .podium-photo {
        width: 80px;
        height: 80px;
      }
      
      .podium-name {
        font-size: 1.4rem;
      }
      
      .podium-time {
        font-size: 1.1rem;
      }
    }
  </style>
</head>
<body>
  <canvas id="confetti"></canvas>
  
  <!-- Center Logo -->
  <div class="center-logo">
    <img src="https://raw.githubusercontent.com/SergeHanssens/grndbrekers-bull-studay2025/images/grndbrekers-bull-logo-transparant-V5.png" 
         alt="GRNDbrekers Logo">
  </div>

  <!-- Left section - Top 3 -->
  <div class="left-section">
    <div class="top-three" id="topThree">
      <div class="no-data">Wachten op deelnemers...</div>
    </div>
  </div>

  <!-- Right section - Rest (4-10) -->
  <div class="right-section">
    <div class="rest-leaderboard" id="restLeaderboard">
      <div class="no-data">Geen deelnemers buiten top 3</div>
    </div>
  </div>

  <!-- Footer with Shiftedmake logo -->
  <div class="footer-logo">
    <a href="http://www.shiftedmake.com/" target="_blank" rel="noopener noreferrer">
      <img src="https://raw.githubusercontent.com/SergeHanssens/grndbrekers-bull-studay2025/images/shiftedmake-logo.png" 
           alt="Shiftedmake" />
    </a>
  </div>

  <!-- Canvas confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  
  <script>
    // Placeholder foto
    const DEFAULT_PHOTO = 'data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjAwIiBoZWlnaHQ9IjIwMCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj4KICA8Y2lyY2xlIGN4PSIxMDAiIGN5PSIxMDAiIHI9IjEwMCIgZmlsbD0iIzMzMyIvPgogIDxjaXJjbGUgY3g9IjEwMCIgY3k9Ijg1IiByPSIzNSIgZmlsbD0iI2FhYSIvPgogIDxlbGxpcHNlIGN4PSIxMDAiIGN5PSIxNTAiIHJ4PSI1NSIgcnk9IjQwIiBmaWxsPSIjYWFhIi8+Cjwvc3ZnPg==';

    let previousRiders = [];
    let isFirstRender = true;

    // Process riders with proper ranking for ties
    function processRidersWithRanking(riders) {
      const processed = [];
      let currentRank = 1;
      let skipNext = 0;
      
      for (let i = 0; i < riders.length; i++) {
        const rider = { ...riders[i] };
        
        if (i === 0) {
          rider.rank = 1;
        } else if (riders[i].time === riders[i - 1].time) {
          // Same time as previous rider
          rider.rank = processed[i - 1].rank;
          skipNext++;
        } else {
          // Different time
          currentRank += skipNext + 1;
          rider.rank = currentRank;
          skipNext = 0;
        }
        
        // Determine medal color based on actual rank
        if (rider.rank === 1) {
          rider.medal = 'gold';
        } else if (rider.rank === 2) {
          rider.medal = 'silver';
        } else if (rider.rank === 3) {
          rider.medal = 'bronze';
        } else {
          rider.medal = null;
        }
        
        processed.push(rider);
      }
      
      return processed;
    }

    // Fixed photo URL function to handle new format
    function getPhotoUrl(rider) {
      if (rider.photo) {
        // Handle new format {thumbnail, fullsize}
        if (typeof rider.photo === 'object' && rider.photo.fullsize) {
          return rider.photo.fullsize;
        }
        // Handle new format but use thumbnail if fullsize not available
        if (typeof rider.photo === 'object' && rider.photo.thumbnail) {
          return rider.photo.thumbnail;
        }
        // Handle old string format
        if (typeof rider.photo === 'string') {
          if (rider.photo.startsWith('data:image')) {
            return rider.photo;
          }
          return rider.photo;
        }
      }
      return DEFAULT_PHOTO;
    }

    function renderLeaderboard(riders) {
      console.log('Rendering leaderboard with', riders?.length || 0, 'riders');
      
      if (!riders || riders.length === 0) {
        document.getElementById('topThree').innerHTML = '<div class="no-data">Wachten op deelnemers...</div>';
        document.getElementById('restLeaderboard').innerHTML = '<div class="no-data">Geen deelnemers buiten top 3</div>';
        return;
      }

      // Process riders with proper ranking
      const processedRiders = processRidersWithRanking(riders);
      
      // Split into top 3 and rest (max 10 total)
      const top3 = processedRiders.filter(r => r.medal !== null);
      const rest = processedRiders.filter(r => r.medal === null).slice(0, 10 - top3.length);

      // Check for new entries before rendering
      const newTopEntries = checkForNewTopEntries(top3);
      const newRestEntries = checkForNewRestEntries(rest);

      renderTopThree(top3, newTopEntries);
      renderRest(rest, newRestEntries);

      if (!isFirstRender) {
        checkForChanges(processedRiders);
      }

      previousRiders = processedRiders.map(r => ({...r}));
      isFirstRender = false;
    }

    function checkForNewTopEntries(currentTop3) {
      const newEntries = new Set();
      
      if (!isFirstRender && previousRiders.length > 0) {
        const previousTop3Names = previousRiders
          .filter(r => r.medal !== null)
          .map(r => r.name);
        
        currentTop3.forEach(rider => {
          if (!previousTop3Names.includes(rider.name)) {
            newEntries.add(rider.name);
            // Trigger fireworks for new top 3 entries
            console.log(`Nieuwe top 3 entry: ${rider.name}`);
            triggerFireworks();
            triggerConfetti();
          }
        });
      }
      
      return newEntries;
    }

    function checkForNewRestEntries(currentRest) {
      const newEntries = new Set();
      
      if (!isFirstRender && previousRiders.length > 0) {
        // Get all names that were in the entire top 10 before
        const previousTop10Names = previousRiders
          .slice(0, 10)
          .map(r => r.name);
        
        currentRest.forEach(rider => {
          // Only highlight if they weren't in the top 10 at all before
          if (!previousTop10Names.includes(rider.name)) {
            newEntries.add(rider.name);
            console.log(`Echte nieuwe entry in top 10: ${rider.name}`);
          }
        });
      }
      
      return newEntries;
    }

    function renderTopThree(riders, newEntries = new Set()) {
      const container = document.getElementById('topThree');
      container.innerHTML = '';

      if (riders.length === 0) {
        container.innerHTML = '<div class="no-data">Nog geen deelnemers in de top 3</div>';
        return;
      }

      riders.forEach((rider, index) => {
        const div = document.createElement('div');
        const isNew = newEntries.has(rider.name);
        div.className = `podium-spot ${rider.medal} fade-in ${isNew ? 'new-podium-highlight' : ''}`;
        div.style.animationDelay = `${index * 0.2}s`;
        
        div.innerHTML = `
          <div class="podium-card">
            <div class="podium-rank">${rider.rank}</div>
            <img class="podium-photo" 
                 src="${getPhotoUrl(rider)}" 
                 alt="${rider.name}" 
                 onerror="this.src='${DEFAULT_PHOTO}'">
            <div class="podium-info">
              <div class="podium-name">${rider.name}</div>
              <div class="podium-time">${rider.time || '--:--:--'}</div>
            </div>
          </div>
        `;
        
        container.appendChild(div);
      });
    }

    function renderRest(riders, newEntries = new Set()) {
      const container = document.getElementById('restLeaderboard');
      
      if (riders.length === 0) {
        container.innerHTML = '<div class="no-data">Geen deelnemers buiten top 3</div>';
        return;
      }

      container.innerHTML = '';
      riders.forEach((rider, index) => {
        const div = document.createElement('div');
        const isNew = newEntries.has(rider.name);
        div.className = `leaderboard-entry fade-in ${isNew ? 'new-entry-highlight' : ''}`;
        div.style.animationDelay = `${index * 0.05}s`;
        
        div.innerHTML = `
          <div class="entry-rank">${rider.rank}</div>
          <img class="entry-photo" 
               src="${getPhotoUrl(rider)}" 
               alt="${rider.name}" 
               onerror="this.src='${DEFAULT_PHOTO}'">
          <div class="entry-name">${rider.name}</div>
          <div class="entry-time">${rider.time || '--:--:--'}</div>
        `;
        
        container.appendChild(div);
      });
    }

    function checkForChanges(currentRiders) {
      const newNumber1 = currentRiders.filter(r => r.rank === 1);
      const oldNumber1 = previousRiders.filter(r => r.rank === 1);
      
      if (newNumber1.length > 0 && (oldNumber1.length === 0 || 
          !newNumber1.every(n => oldNumber1.some(o => o.name === n.name)))) {
        console.log('Nieuwe nummer 1!');
        triggerFireworks();
        triggerConfetti();
      }
    }

    function triggerFireworks() {
      const duration = 3 * 1000;
      const animationEnd = Date.now() + duration;
      const defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 999 };

      function randomInRange(min, max) {
        return Math.random() * (max - min) + min;
      }

      const interval = setInterval(function() {
        const timeLeft = animationEnd - Date.now();
        if (timeLeft <= 0) return clearInterval(interval);

        const particleCount = 50 * (timeLeft / duration);
        
        confetti(Object.assign({}, defaults, {
          particleCount,
          origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 }
        }));
        confetti(Object.assign({}, defaults, {
          particleCount,
          origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 }
        }));
      }, 250);
    }

    function triggerConfetti() {
      confetti({
        particleCount: 100,
        spread: 70,
        origin: { y: 0.6 }
      });
    }

    // Globale update functie voor sync-client.js
    window.updateLeaderboard = function(data) {
      console.log('updateLeaderboard called with', data?.length || 0, 'entries');
      if (data && Array.isArray(data)) {
        renderLeaderboard(data);
      }
    };

    window.updateAllLeaderboards = function(data) {
      console.log('updateAllLeaderboards called');
      window.updateLeaderboard(data || window.leaderboardData);
    };

    // Load sync-client with better error handling
    function loadSyncClient() {
      console.log('Starting sync-client loading process...');
      
      // First check if socket.io is available
      if (typeof io === 'undefined') {
        console.log('Socket.io not found, loading...');
        const socketScript = document.createElement('script');
        socketScript.src = '/socket.io/socket.io.js';
        socketScript.onload = () => {
          console.log('Socket.io loaded successfully');
          loadSyncClientScript();
        };
        socketScript.onerror = (e) => {
          console.error('Could not load socket.io:', e);
          // Still try to load sync-client
          loadSyncClientScript();
        };
        document.head.appendChild(socketScript);
      } else {
        console.log('Socket.io already available');
        loadSyncClientScript();
      }
    }

    function loadSyncClientScript() {
      console.log('Loading sync-client.js...');
      const script = document.createElement('script');
      script.src = 'sync-client.js';
      script.onload = () => {
        console.log('sync-client.js loaded successfully');
        
        // Wait a bit for sync-client to initialize
        setTimeout(() => {
          // Check for leaderboard data in multiple places
          if (window.leaderboardData && Array.isArray(window.leaderboardData)) {
            console.log('Found leaderboardData:', window.leaderboardData.length, 'entries');
            renderLeaderboard(window.leaderboardData);
          } else if (window.riders && Array.isArray(window.riders)) {
            console.log('Found riders data:', window.riders.length, 'entries');
            renderLeaderboard(window.riders);
          } else {
            console.log('No data found, checking localStorage...');
            try {
              const storedLeaderboard = localStorage.getItem('leaderboard');
              if (storedLeaderboard) {
                const data = JSON.parse(storedLeaderboard);
                console.log('Found data in localStorage:', data.length, 'entries');
                renderLeaderboard(data);
              } else {
                console.log('No data in localStorage either');
              }
            } catch (e) {
              console.error('Error reading localStorage:', e);
            }
          }
        }, 500);
      };
      script.onerror = (e) => {
        console.error('Failed to load sync-client.js:', e);
        // Try to get data from localStorage as fallback
        setTimeout(() => {
          try {
            const storedLeaderboard = localStorage.getItem('leaderboard');
            if (storedLeaderboard) {
              const data = JSON.parse(storedLeaderboard);
              renderLeaderboard(data);
            }
          } catch (e) {
            console.error('Error reading localStorage:', e);
          }
        }, 100);
      };
      document.head.appendChild(script);
    }

    // Auto-refresh data every 2 seconds - DISABLED
    /*
    setInterval(() => {
      if (window.leaderboardData && Array.isArray(window.leaderboardData)) {
        renderLeaderboard(window.leaderboardData);
      } else if (window.riders && Array.isArray(window.riders)) {
        renderLeaderboard(window.riders);
      }
    }, 2000);
    */

    // Start loading
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', loadSyncClient);
    } else {
      loadSyncClient();
    }

    // Fullscreen
    document.addEventListener("DOMContentLoaded", () => {
      const requestFS = () => {
        const el = document.documentElement;
        if (el.requestFullscreen) el.requestFullscreen();
      };
      setTimeout(requestFS, 500);

      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && document.fullscreenElement) {
          if (document.exitFullscreen) document.exitFullscreen();
        }
      });
    });
  </script>
</body>
</html>
